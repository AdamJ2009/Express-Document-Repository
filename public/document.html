<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document Details</title>
</head>
<body>
  <a href="/" class="back-link">&larr; Back to Document List</a>
  <h2>Document Details</h2>

  <div id="loading">Loading document details...</div>

  <div id="documentDetails" style="display: none;">
    <p><strong>ID:</strong> <span id="docId"></span></p>
    <p><strong>File Name:</strong> <span id="fileName"></span></p>
    <p><strong>Importance:</strong> <span id="importanceFlag"></span></p>
    <p><strong>Archive Status:</strong> <span id="archiveFlag"></span></p>
    <p><strong>Access Level:</strong> <span id="accessFlag"></span></p>
    <p><strong>Created At:</strong> <span id="createdAt"></span></p>
    <p><strong>Updated At:</strong> <span id="updatedAt"></span></p>
    <p><strong>History Ref:</strong> <span id="historyRef"></span></p>
    <p>
      <a id="downloadLink" href="#" target="_blank">Download File</a>
    </p>

    <!-- Action Buttons Container -->
    <div style="display: flex; gap: 10px; margin-top: 15px;">
      <!-- Edit Button (Only visible when NOT archived) -->
      <a id="editBtn" href="#" style="background-color: #0275d8; color: white; border: none; padding: 8px 16px; text-decoration: none; display: inline-block; cursor: pointer;">
        Edit
      </a>

      <!-- Dynamic Action Button (Archive or Restore) -->
      <button id="actionBtn" style="border: none; padding: 8px 16px; cursor: pointer; color: white;">
        Loading...
      </button>
    </div>
  </div>

  <div id="error" style="color: red;"></div>

  <script src="/javascripts/document.js"></script>
</body>
</html>
