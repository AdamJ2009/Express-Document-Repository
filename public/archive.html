<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document Archive</title>
</head>
<body>
  <div class="header-actions">
    <h2>Document Archive</h2>
    <a href="/" class="btn">&larr; Back to Active Documents</a>
  </div>

  <div class="list-section">
    <h3>Archived Documents</h3>
    <table>
      <thead>
        <tr>
          <th>File Name</th>
          <th>Archived At</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="documentsTableBody">
        <tr><td colspan="3">Loading archived documents...</td></tr>
      </tbody>
    </table>
  </div>

  <script src="javascripts/archive.js"></script>
</body>
</html>
